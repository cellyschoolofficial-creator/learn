<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celly School · Talk to Celly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
<style>
:root{--cream:#FAF6E9;--ink:#1F2A44;--line:#2E3F6E;--bio:#81A63C;--bio-pale:#DCEBC4;--paper:#fff}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Lexend",system-ui,"Segoe UI",Arial,sans-serif;font-size:20px;line-height:1.6;letter-spacing:.02em}
main{max-width:760px;margin:0 auto;padding:32px 16px;display:grid;gap:18px}
h1{font-weight:600;font-size:32px;margin:0}
a.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:18px 20px}
a.card:hover{background:var(--bio-pale)}
.chip{display:inline-block;border:3px solid var(--bio);background:var(--bio-pale);border-radius:999px;padding:0 12px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Talk to Celly</h1>
  <p>Practise after each Celly School lesson. Celly talks, listens and plays along. Use Chrome or Edge, and allow the microphone once.</p>
  <a class="card" href="7ad/"><span class="chip">biology · 7Ad</span><br><b>Cells, part 2: inside cells</b><br>Help Celly get her parts back after a big sneeze.</a>
  <p><a href="https://www.cellyschool.com">www.cellyschool.com</a></p>
</main>
</body>
</html>
