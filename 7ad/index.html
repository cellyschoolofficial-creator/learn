<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talk to Celly · 7Ad Cells</title>
<meta name="description" content="Help Celly get her cell parts back. A talking, dyslexia-friendly practice game for the Celly School 7Ad Cells lesson.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
<style>
/* layout: Celly's stage on the left (top on phones), one activity card at a time beside her; same cream world and soft blobs as the video */
:root{
  --cream:#FAF6E9; --paper:#FFFFFF; --ink:#1F2A44; --line:#2E3F6E; --soft:#56607A;
  --bio:#81A63C; --bio-mid:#B5D27E; --bio-pale:#DCEBC4; --edge:#E6DFC9;
  --nucleus:#8E6CC9; --cyto:#FBE7A1; --membrane:#F27BA0; --mito:#F29E4C;
  --wall:#A9774A; --chloro:#5DAA4E; --vacuole:#6FA8DC;
  --good:#3F8F3A; --try:#C8742A; --listen:#E0455F;
  --font:"Lexend","Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.6;letter-spacing:.02em;word-spacing:.08em;overflow-x:hidden}
button{font:inherit;color:inherit}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35}
.blobs i:nth-child(1){width:46vmax;height:46vmax;left:-16vmax;top:-12vmax;background:#E9E1F5}
.blobs i:nth-child(2){width:38vmax;height:38vmax;right:-14vmax;top:18vh;background:#DCEBC4}
.blobs i:nth-child(3){width:40vmax;height:40vmax;left:20vw;bottom:-24vmax;background:#FDEBC8}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--bio);background:var(--bio-pale);border-radius:999px;padding:2px 14px;font-size:16px;font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:2px solid var(--edge);background:var(--paper);border-radius:14px;padding:6px 12px;font-size:16px;cursor:pointer}
.tbtn[aria-pressed="true"]{border-color:var(--bio);background:var(--bio-pale)}
:focus-visible{outline:4px solid var(--line);outline-offset:2px}
.trail{display:flex;gap:8px;align-items:center;margin-block:10px;flex-wrap:wrap}
.trail .step{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--soft);border:2px solid var(--edge);background:var(--paper);border-radius:999px;padding:0 10px}
.trail .step.now{border-color:var(--line);color:var(--ink);font-weight:600}
.trail .step.done{border-color:var(--bio);background:var(--bio-pale);color:var(--ink)}
.game{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);display:grid;gap:10px;justify-items:center}
.bubble{position:relative;width:100%;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:12px 16px;font-size:22px;min-height:84px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);border:13px solid transparent;border-top-color:var(--line);border-bottom:0}
.bubble .again{position:absolute;right:8px;bottom:-22px}
.actors{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-end;gap:4px;min-height:280px}
#celly{width:min(100%,330px);transition:width .4s}
#cabbage{display:none}
.withCab #celly{width:min(56%,250px)}
.withCab #cabbage{display:block;width:min(44%,200px);animation:pop .6s}
svg.rig{width:100%;height:auto;display:block;overflow:visible;touch-action:manipulation}
.ear{position:absolute;top:6px;left:6px;display:none;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--listen);border-radius:999px;padding:2px 12px;font-size:15px;font-weight:600}
.ear i{width:12px;height:12px;border-radius:50%;background:var(--listen);animation:pulse 1s infinite}
.listening .ear{display:inline-flex}
.live{font-size:15px;color:var(--soft);min-height:1.5em;text-align:center}
@keyframes pulse{50%{transform:scale(1.6);opacity:.4}}
.card{background:var(--paper);border:3px solid var(--edge);border-radius:24px;padding:20px;display:grid;gap:16px;min-width:0}
h1,h2{font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:24px}
p{margin:0;max-width:62ch}
.muted{color:var(--soft);font-size:17px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.big{border:3px solid var(--line);background:var(--bio-pale);border-radius:18px;padding:12px 24px;font-size:22px;font-weight:600;cursor:pointer;min-height:58px}
.big.plain{background:var(--paper)}
.big.go{font-size:26px;padding:14px 34px}
.note{border-left:6px solid var(--bio);padding:10px 14px;background:var(--cream);border-radius:8px;font-size:17px}
details.note summary{cursor:pointer;font-weight:600}
/* video */
.clip{width:100%;border-radius:18px;border:3px solid var(--line);background:#000;aspect-ratio:16/9;max-width:100%}
/* word builder */
.slots,.tiles{display:flex;gap:10px;flex-wrap:wrap;min-height:66px}
.slot{min-width:86px;height:66px;border:3px dashed var(--edge);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.slot.filled{border-style:solid;border-color:var(--line);background:var(--cyto);animation:pop .3s}
.tile{min-width:86px;height:66px;border:3px solid var(--line);border-radius:16px;background:var(--paper);font-size:28px;cursor:pointer;padding-inline:12px;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile.used{visibility:hidden}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.meaning{display:flex;gap:12px;align-items:flex-start}
.swatch{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;margin-top:4px}
.beats{display:flex;gap:10px}
.beats i{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);background:var(--paper)}
.beats i.on{background:var(--bio);animation:pop .25s}
.drum{width:120px;height:120px;border-radius:50%;border:4px solid var(--line);background:radial-gradient(circle at 40% 35%,#FFF6D6,var(--cyto));font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 6px 0 var(--line)}
.drum:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.wordshow{font-size:40px;font-weight:600;letter-spacing:.06em}
/* label chips */
.labels{display:flex;gap:8px;flex-wrap:wrap}
.lab{display:inline-flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:17px;animation:pop .3s}
.lab i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.taphint{font-size:18px;font-weight:600;border:3px dashed var(--bio);border-radius:16px;padding:10px 14px;background:var(--bio-pale)}
/* brain break */
.move{font-size:30px;font-weight:600;text-align:center;padding:18px;border:3px solid var(--line);border-radius:20px;background:var(--cream)}
/* sort */
.sortcard{border:3px solid var(--line);border-radius:20px;padding:16px 20px;font-size:30px;font-weight:600;display:flex;gap:14px;align-items:center;justify-content:center;background:var(--cream);animation:pop .3s}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{border:3px solid var(--line);border-radius:20px;padding:12px;background:var(--paper);cursor:pointer;font-size:20px;font-weight:600;min-height:120px;display:grid;align-content:start;gap:6px;text-align:left}
.bin small{font-weight:400;font-size:15px;color:var(--soft)}
.bin .got{display:flex;flex-wrap:wrap;gap:6px}
.bin .got span{font-size:14px;font-weight:400;border:2px solid var(--edge);border-radius:999px;padding:0 8px}
.bin.wrong{animation:shake .35s;border-color:var(--try)}
/* options */
.opts{display:grid;gap:10px}
.opt{border:3px solid var(--line);border-radius:16px;background:var(--paper);padding:12px 16px;text-align:left;font-size:20px;cursor:pointer}
.opt.right{background:var(--bio-pale);border-color:var(--good)}
.opt.wrong{background:#FBEBDD;border-color:var(--try)}
/* certificate */
.cert{border:6px double var(--bio);border-radius:24px;padding:20px;text-align:center;background:linear-gradient(#FFFDF6,#FAF6E9);display:grid;gap:8px;justify-items:center}
.cert .t{font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.cert .n{font-size:34px;font-weight:600;min-height:1.3em}
.cert input{font:inherit;font-size:20px;border:2px solid var(--edge);border-radius:12px;padding:6px 12px;text-align:center;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:17px}
td,th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--edge);vertical-align:top}
th{font-weight:600}
.tag{display:inline-block;border-radius:999px;padding:0 10px;font-size:14px;font-weight:600;border:2px solid}
.tag.ok{border-color:var(--good);color:var(--good)}
.tag.help{border-color:var(--try);color:var(--try)}
.tablebox{overflow-x:auto}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.flyer{position:fixed;z-index:60;pointer-events:none;width:64px;height:64px;margin:-32px 0 0 -32px}
/* Celly rig animation */
.rig .whole{transform-box:fill-box;transform-origin:50% 100%}
.rig.idle .whole{animation:breathe 3.2s ease-in-out infinite}
.rig.talk .whole{animation:bob .5s ease-in-out infinite alternate}
.rig.happy .whole{animation:hop .5s ease-out 2}
.rig.dance .whole{animation:dance .8s ease-in-out infinite}
.rig.shiver .whole{animation:shiver .12s linear infinite}
.rig.spin .whole{animation:spin 1.6s ease-in-out}
.rig.wiggle .whole{animation:wig .25s ease-in-out infinite alternate}
.rig.breath .whole{animation:slowbreath 4s ease-in-out}
.rig .eye{transform-box:fill-box;transform-origin:50% 50%}
.rig .eye.blink{animation:blink .18s}
.rig .armR{transform-box:fill-box;transform-origin:20% 10%}
.rig.wave .armR{animation:wave .45s ease-in-out 4 alternate}
.rig.pump .armR,.rig.pump .armL{animation:pump .35s ease-in-out infinite alternate}
.rig .armL{transform-box:fill-box;transform-origin:80% 10%}
.rig .part{transition:opacity .4s}
.rig .gone{opacity:0}
.rig .mito.glow rect{filter:drop-shadow(0 0 6px #F29E4C)}
.rig .nuc.pulse{animation:npulse .5s ease-in-out 4 alternate;transform-box:fill-box;transform-origin:50% 50%}
.rig .tapme{cursor:pointer}
.cab .whole{transform-box:fill-box;transform-origin:50% 100%;animation:wobble 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,.985)}}
@keyframes bob{to{transform:translateY(-6px) rotate(-1.5deg)}}
@keyframes hop{50%{transform:translateY(-26px) scale(1.04,.97)}}
@keyframes dance{25%{transform:rotate(-8deg) translateY(-10px)}75%{transform:rotate(8deg) translateY(-10px)}}
@keyframes shiver{50%{transform:translateX(3px) rotate(1deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wig{to{transform:skewX(6deg) scale(1.02,.98)}}
@keyframes slowbreath{50%{transform:scale(1.08)}}
@keyframes blink{50%{transform:scaleY(.08)}}
@keyframes wave{to{transform:rotate(-38deg)}}
@keyframes pump{to{transform:rotate(-50deg)}}
@keyframes npulse{to{transform:scale(1.25)}}
@keyframes wobble{25%{transform:skewX(4deg) scaleY(.98)}75%{transform:skewX(-4deg) scaleY(1.02)}}
@media (max-width:820px){
  .game{grid-template-columns:1fr}
  .stage{position:relative;top:0;grid-template-columns:120px 1fr;align-items:center;justify-items:stretch}
  .actors{min-height:0;order:-1}
  #celly{width:140px}
  .withCab #celly{width:76px}.withCab #cabbage{width:66px}
  .stage{grid-template-columns:150px 1fr}
  .trail{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .trail .step{white-space:nowrap}
  .bubble{font-size:19px;padding:10px 14px;min-height:0}
  .bubble::after{left:-14px;top:30px;bottom:auto;transform:none;border:12px solid transparent;border-right-color:var(--line);border-left:0}
  .bubble .again{position:static;margin-top:6px}
  .ear{top:-6px;left:-6px;font-size:12px;padding:0 8px}
  .stage.bigstage{grid-template-columns:1fr}
  .stage.bigstage .actors{order:0}
  .stage.bigstage #celly{width:min(86vw,330px)}
  .stage.bigstage .bubble::after{left:50%;top:auto;bottom:-15px;transform:translateX(-50%);border:13px solid transparent;border-top-color:var(--line);border-bottom:0}
  .live{grid-column:1/-1}
}
@media (max-width:520px){
  body{font-size:18px}
  .slot,.tile{min-width:64px;height:56px;font-size:23px}
  .bins{grid-template-columns:1fr}
  .sortcard{font-size:25px}
  h1{font-size:25px}
  .wordshow{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <span class="chip">biology · year 7 · 7Ad cells · part 2</span>
    <div class="tools">
      <button class="tbtn" id="modeTalk" aria-pressed="true">🎙 talk + tap</button>
      <button class="tbtn" id="modeTap" aria-pressed="false">👆 tap only</button>
      <button class="tbtn" id="muteBtn" aria-pressed="false">🔈 Celly's voice on</button>
    </div>
  </header>
  <nav class="trail" id="trail" aria-label="Progress"></nav>
  <div class="game">
    <section class="stage" id="stage" aria-live="polite">
      <div class="bubble" id="bubble"><span id="say">Hello, scientist!</span>
        <div class="again"><button class="tbtn" id="again">🔁 say it again</button></div></div>
      <div class="actors" id="actors">
        <span class="ear" aria-hidden="true"><i></i>Celly is listening</span>
        <div id="celly"></div>
        <div id="cabbage"></div>
      </div>
      <div class="live" id="live"></div>
    </section>
    <main class="card" id="card"></main>
  </div>
</div>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
